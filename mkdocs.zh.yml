site_name: AG-UI Protocol 中文文档
site_description: AG-UI（Agent-User Interaction Protocol）官方文档简体中文翻译版：入门指南、核心概念、集成与教程、1.0 规范全文、TypeScript/Python/.NET SDK 参考。AG-UI 是标准化智能体与面向用户应用之间通信的开放协议：一个请求进入，一条有序的类型化事件流输出，承载用户可见的全部智能体行为——文本、工具调用、推理、共享状态与进度。
repo_url: https://github.com/ag-ui-protocol/ag-ui
site_url: https://noexcs.github.io/ag-ui-zh/
edit_uri: ''
strict: false
use_directory_urls: false
docs_dir: docs-zh
site_dir: site-zh

